name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check Bash syntax
        run: |
          for file in shutdown-notify.sh tests/*.sh; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck shutdown-notify.sh tests/*.sh

      - name: Run tests
        run: bash tests/run.sh
